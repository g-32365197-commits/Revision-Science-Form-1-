<!DOCTYPE html><html lang="ms"><head><meta charset="utf-8"><title>Science Obby – Section A</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#1b1f3b;--panel:#2a3060;--line:#0d1026;--tx:#fff;--mu:#b8c0ff;--y:#ffd43b;--g:#40c057;--r:#fa5252;--b:#339af0;--o:#ff922b;--p:#9775fa}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg) linear-gradient(#ffffff0d 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,#ffffff0d 1px,transparent 1px) 0 0/40px 40px;color:var(--tx);font:600 17px/1.4 Fredoka,"Trebuchet MS",system-ui,sans-serif;min-height:100%}
main{max-width:720px;margin:0 auto;padding:14px}
.blk{background:var(--panel);border:4px solid var(--line);border-radius:10px;box-shadow:0 6px 0 var(--line);padding:16px;margin-bottom:16px}
h1{margin:0;font-size:2.2rem;line-height:1;text-shadow:3px 3px 0 var(--line);text-align:center}h1 span{color:var(--y)}
.sub{color:var(--mu);text-align:center;margin:8px 0 14px}
input{width:100%;padding:12px;border:4px solid var(--line);border-radius:8px;background:#fff;color:#111;font:inherit;margin:4px 0 10px}
.btn{display:block;width:100%;border:4px solid var(--line);border-radius:10px;padding:12px 16px;font:700 1.1rem Fredoka,sans-serif;color:#fff;background:var(--g);box-shadow:0 6px 0 #1c7a2e,0 6px 0 4px var(--line);cursor:pointer;transition:.08s;text-shadow:2px 2px 0 #0004}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #1c7a2e,0 1px 0 4px var(--line)}
.avatar{width:72px;height:72px;margin:0 auto 10px;background:var(--y);border:4px solid var(--line);border-radius:8px;position:relative;animation:bob 1.2s infinite ease-in-out}
.avatar:before,.avatar:after{content:"";position:absolute;top:24px;width:10px;height:14px;background:var(--line);border-radius:2px}.avatar:before{left:16px}.avatar:after{right:16px}
.avatar i{position:absolute;left:22px;right:22px;bottom:12px;height:8px;border-bottom:5px solid var(--line);border-radius:0 0 12px 12px}
@keyframes bob{50%{transform:translateY(-8px)}}
.hud{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chip{flex:1;min-width:90px;background:var(--panel);border:4px solid var(--line);border-radius:10px;box-shadow:0 4px 0 var(--line);padding:4px 10px;text-align:center;font-size:.95rem}.chip b{color:var(--y)}
.xp{height:18px;background:var(--line);border-radius:9px;overflow:hidden;margin:0 0 12px;border:3px solid var(--line)}.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--b),var(--p));transition:width .4s}
.path{display:flex;gap:3px;margin:0 0 14px}.path u{flex:1;height:12px;background:var(--line);border-radius:3px;text-decoration:none}.path u.ok{background:var(--g)}.path u.no{background:var(--r)}.path u.cur{background:var(--y);animation:bob .8s infinite}
.qn{display:inline-block;background:var(--o);border:3px solid var(--line);border-radius:8px;padding:0 10px;margin-bottom:8px;text-shadow:2px 2px 0 #0004}
.en{color:var(--mu);font-weight:500;font-style:italic;margin:4px 0 10px}
.imgs img{max-width:100%;max-height:240px;background:#fff;border:4px solid var(--line);border-radius:8px;margin:0 6px 8px 0}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:4px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;color:#fff;font:700 1rem Fredoka,sans-serif;cursor:pointer;box-shadow:0 5px 0 var(--line);transition:.08s;text-shadow:2px 2px 0 #0004}
.opt:not(:disabled):active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}.opt small{display:block;font-weight:500;font-style:italic;opacity:.9}
.opt .l{flex:none;width:36px;height:36px;display:grid;place-items:center;background:#fff;color:var(--line);border:3px solid var(--line);border-radius:6px;text-shadow:none}
.o0{background:var(--r)}.o1{background:var(--b)}.o2{background:var(--o)}.o3{background:var(--p)}
.opt.right{background:var(--g)!important;animation:pop .4s}.opt.wrong{background:#555!important;animation:shake .4s}.opt:disabled{cursor:default}.opt:disabled:not(.right):not(.wrong){opacity:.45}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@keyframes pop{50%{transform:scale(1.04)}}
.fb{text-align:center;font-size:1.3rem;margin:6px 0 10px;min-height:1.6em}
.hide{display:none}.big{font-size:3rem;text-align:center;text-shadow:3px 3px 0 var(--line)}
.toast{position:fixed;left:50%;top:30%;transform:translate(-50%,0);font-size:2rem;color:var(--y);text-shadow:3px 3px 0 var(--line);pointer-events:none;animation:up 1s forwards;z-index:9;text-align:center}
@keyframes up{to{transform:translate(-50%,-80px);opacity:0}}
.rev{font-weight:500;text-align:left;margin:6px 0;font-size:.95rem}.rev b{color:var(--y)}
</style></head><body><main>

<button class="btn" onclick="begin()">▶ PLAY / MAIN</button></div>

<div id="game" class="hide">
<div class="hud"><div class="chip">👤 <b id="who"></b></div><div class="chip">🪙 <b id="coins">0</b></div><div class="chip">⭐ Lv <b id="lv">1</b></div><div class="chip">🔥 <b id="stk">0</b></div><div class="chip" id="mt" onclick="mute()" style="cursor:pointer;flex:none;min-width:56px">🔊</div></div>
<div class="xp"><i id="xp"></i></div><div class="path" id="path"></div>
<div class="blk" id="card"></div>
<div class="fb" id="fb"></div><button class="btn hide" id="nx" style="background:var(--b);box-shadow:0 6px 0 #1864ab,0 6px 0 4px var(--line)" onclick="next()">NEXT STAGE ▶</button></div>

<div id="end" class="blk hide"></div>

epada pesakit hamil: \"Saya sarankan kamu makan lebih banyak daging merah kerana tahap hemoglobin kamu agak rendah.\" Mengapakah doktor menyarankan sedemikian?", "en": "The doctor tells her patient: \"I recommend you eat more red meat because your haemoglobin level is quite low.\" Why does the doctor recommend to do so?", "o": [["Daging merah penting untuk mencegah anemia", "Red meat is important for preventing anemia"], ["Daging merah penting untuk mencegah gusi berdarah", "Red meat is important to prevent bleeding gums"], ["Daging merah mempunyai banyak karbohidrat", "Red meat has a lot of carbohydrates"], ["Daging merah memastikan bayi lahir dengan berat yang sesuai", "Red meat ensures that baby are born with suitable weight"]], "a": 0, "im": []}, {"n": 15, "bm": "Salim berkata kepada Fahim: \"Fahim, jangan isi tayar kenderaan pada tekanan maksimum.\" Mengapakah Salim mengatakan demikian?", "en": "Salim tells Fahim: \"Fahim, do not fill the vehicle tires to maximum pressure.\" Why did Salim say that?", "o": [["Agar kenderaan boleh memecut dengan laju", "So that vehicle can accelerate quickly"], ["Agar kenderaan terasa ringan ketika dipandu", "So that vehicle feels light when driven"], ["Agar tayar mempunyai ruang untuk mengempis pada hari yang sejuk", "So that tyres have room to deflate on a cold day"], ["Agar tayar mempunyai ruang untuk mengembang pada hari yang panas", "So that tyres have room to expand on a hot day"]], "a": 3, "im": []}, {"n": 16, "bm": "Jadual: P – Mulur; Q – Penebat haba; R – Permukaan pudar; S – Ketumpatan rendah. Antara berikut, bahan manakah adalah logam?", "en": "Table: P – Ductile; Q – Heat insulator; R – Dull surface; S – Low density. Which of the following substances are metals?", "o": [["P", "P"], ["Q", "Q"], ["R", "R"], ["S", "S"]], "a": 0, "im": []}, {"n": 17, "bm": "Rajah di bawah menunjukkan satu aktiviti manusia. Bagaimanakah aktiviti tersebut menyebabkan kitar oksigen dan kitar karbon terganggu?", "en": "Diagram below shows a h let AC=null,MUTED=false;
function mute(){MUTED=!MUTED;$('mt').textContent=MUTED?'🔇':'🔊'}
function snd(ok){if(MUTED)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const n=AC.currentTime;
const seq=ok?[[523,0],[659,.09],[784,.18],[1047,.27],[1319,.4]]:[[220,0],[165,.15]];
seq.forEach(([f,d],k)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?'square':'sawtooth';o.frequency.value=f;

g.gain.setValueAtTime(.001,n+d);g.gain.linearRampToValueAtTime(.12,n+d+.01);g.gain.exponentialRampToValueAtTime(.001,n+d+e);o.start(n+d);o.stop(n+d+e+.02)})}catch(e){}}
function begin(){if(!$('nm').value.trim()){$('nm').focus();return}
$('start').classList.add('hide');$('game').classList.remove('hide');$('who').textContent=$('nm').value.trim().slice(0,14);show()}
function toast(t){const d=document.createElement('div');d.className='toast';d.innerHTML=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}
function hud(){$('coins').textContent=coins;$('stk').textContent=streak;$('lv').textContent=1+Math.floor(i/5);$('xp').style.width=i/D.length*100+'%';

function show(){const q=D[i];hud();$('fb').textContent='';$('nx').classList.add('hide');
$('card').innerHTML=`<span class="qn">STAGE ${q.n}/${D.length}</span><div>${q.bm}</div><div class="en">${q.en}</div><div class="imgs">${q.im.map(s=>`<img src="${s}" alt="Diagram ${q.n}">`).join('')}</div>`+

window.scrollTo({top:0,behavior:'smooth'})}
function pick(j){const q=D[i],ok=j===q.a,bs=document.querySelectorAll('.opt');bs.forEach(b=>b.disabled=true);
bs[q.a].classList.add('right');res.push(ok);
if(ok){snd(1);score++;streak++;best=Math.max(best,streak);const g=100+(streak>1?streak*10:0);coins+=g;$('fb').innerHTML='✅ Betul! / Correct!';toast('+'+g+' 🪙')}

$('coins').textContent=coins;$('stk').textContent=streak;
$('nx').textContent=i===D.length-1?'FINISH 🏁':'NEXT STAGE ▶';$('nx').classList.remove('hide')}

const p=Math.round(score/D.length*100),r=p>=90?['👑','LEGEND']:p>=75?['🏆','PRO']:p>=50?['🥈','BUILDER']:['🧱','NOOB'];

<div class="hud"><div class="chip">✅ <b>${score}/${D.length}</b></div><div class="chip">📊 <b>${p}%</b></div><div class="chip">🪙 <b>${coins}</b></div><div class="chip">🔥 Best <b>${best}</b></div></div>
${miss?`<div class="blk" style="background:var(--bg)"><b>Semak jawapan / Review:</b>${miss}</div>`:'<p class="sub">Sempurna! / Perfect run! 🎉</p>'}
